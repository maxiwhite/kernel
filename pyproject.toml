[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-codex-plugin"
version = "0.2.0"
description = "Local-first orchestration and evidence tracking for Codex ecosystem work"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kernel = "scripts.kernel:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
