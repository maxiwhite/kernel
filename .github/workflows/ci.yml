name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: UNIFORM1TY/.github/.github/workflows/reusable-python-ci.yml@main
    with:
      python-version: "3.12"
      run-lint: false
      run-tests: true
